name: Mevora CI

# Regression gate for every pull request and for main.
#
# Every job always runs so its check is always reported — a required check
# that is "skipped" blocks a PR the same way a failing one does. Path
# filtering is applied to the expensive steps inside a job instead, driven by
# the `changes` outputs.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")"
          else
            # Push to main and manual runs: treat everything as changed so a
            # direct push can never bypass a suite.
            changed="$(git ls-files)"
          fi
          printf 'changed files:\n%s\n' "$changed"
          match() {
            if printf '%s\n' "$changed" | grep -qE "$1"; then echo true; else echo false; fi
          }
          {
            echo "functions=$(match '^functions/|^\.github/workflows/')"
            echo "rules=$(match '^firebase/|^\.github/workflows/')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  flutter:
    name: Flutter analyze + full test suite
    runs-on: ubuntu-latest
    # Always runs, with no path filter. The Dart suite asserts against
    # firebase/firestore.rules, firebase/storage.rules, functions/src/index.ts
    # and android/app/build.gradle.kts, so it gates backend and release
    # configuration changes too.
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      # Explicit "test" argument: it pins the gate to the whole test/ tree so a
      # future dart_test.yaml (or a runner change) cannot silently narrow it.
      - name: flutter test (full suite)
        run: flutter test test --reporter expanded

  functions:
    name: Cloud Functions build + tests
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.functions == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: npm ci
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm ci
      - name: npm test
        if: needs.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm test
      - name: Skipped
        if: needs.changes.outputs.functions != 'true'
        run: echo "functions/ unchanged — backend suite not required for this PR."

  rules:
    name: Firestore rules + moderation tests
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.rules == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json
      - uses: actions/setup-java@v4
        if: needs.changes.outputs.rules == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules test dependencies
        if: needs.changes.outputs.rules == 'true'
        working-directory: firebase/tests
        run: npm ci
      - name: Build Cloud Functions for the rules suite
        # moderation.pipeline.test.mjs imports the compiled provider from
        # functions/lib, so the rules job needs its own build. Without this the
        # suite dies on ERR_MODULE_NOT_FOUND before any rule is evaluated.
        if: needs.changes.outputs.rules == 'true'
        run: |
          npm --prefix functions ci
          npm --prefix functions run build
      - name: Rules suite against the Firestore and Storage emulators
        # No secrets and no live project: the emulators run locally against the
        # committed firebase/firestore.rules and firebase/storage.rules.
        # Storage is required as well — storage.security.emulator.test.mjs
        # exercises storage.rules and resolves match membership via Firestore.
        if: needs.changes.outputs.rules == 'true'
        run: npx --yes firebase-tools@15 emulators:exec --only firestore,storage --project mevora-dev "npm --prefix firebase/tests test"
      - name: Skipped
        if: needs.changes.outputs.rules != 'true'
        run: echo "firebase/ unchanged — emulator suite not required for this PR."
