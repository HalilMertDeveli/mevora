name: Mevora Smoke Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'tools/smoke/**'
      - 'firebase/**'
      - 'integration_test/**'

jobs:
  unit-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Functions unit tests
        working-directory: functions
        run: npm ci && npm test
      - name: Moderation integration tests
        working-directory: firebase/tests
        run: npm ci && node --test moderation.pipeline.test.mjs

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules test deps
        working-directory: firebase/tests
        run: npm ci
      - name: Firestore + Storage rules (behavioural, emulator)
        run: npx firebase-tools emulators:exec --only firestore,storage --project mevora-rules-ci "npm --prefix firebase/tests run test:security"

  flutter-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter analyze + default tests
        working-directory: .
        run: |
          flutter pub get
          flutter analyze
          flutter test test/security/ test/features/safety/
