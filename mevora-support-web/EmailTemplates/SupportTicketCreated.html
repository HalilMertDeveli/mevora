<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>New Mevora support ticket</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;font-family:Manrope,Segoe UI,Arial,sans-serif;color:#1f1f1f;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#fafafa;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;">
          <tr>
            <td>
              <div style="font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:700;background:linear-gradient(135deg,#d63384,#c026d3);-webkit-background-clip:text;color:#d63384;">{{SiteName}}</div>
              <h1 style="font-size:20px;margin:16px 0 8px;">Yeni destek talebi</h1>
              <p style="color:#6b7280;margin:0 0 20px;">Web sitesinden yeni bir support ticket oluşturuldu.</p>
              <table role="presentation" width="100%" style="font-size:14px;line-height:1.6;">
                <tr><td style="color:#6b7280;width:140px;">Ticket ID</td><td><strong>{{TicketId}}</strong></td></tr>
                <tr><td style="color:#6b7280;">Status</td><td>{{Status}}</td></tr>
                <tr><td style="color:#6b7280;">Priority</td><td>{{Priority}}</td></tr>
                <tr><td style="color:#6b7280;">Category</td><td>{{Category}}</td></tr>
                <tr><td style="color:#6b7280;">Subject</td><td>{{Subject}}</td></tr>
                <tr><td style="color:#6b7280;">From</td><td>{{Name}} &lt;{{Email}}&gt;</td></tr>
                <tr><td style="color:#6b7280;">User ID</td><td>{{UserId}}</td></tr>
                <tr><td style="color:#6b7280;">Created</td><td>{{CreatedAt}}</td></tr>
              </table>
              <div style="margin-top:20px;padding:16px;background:#f3f4f6;border-radius:12px;font-size:14px;line-height:1.55;">{{Description}}</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
