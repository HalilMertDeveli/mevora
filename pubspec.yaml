name: mevora
description: Mevora helps people discover compatible connections.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  cloud_functions: ^6.3.6
  flutter_idensic_mobile_sdk_plugin: ^1.45.1
  firebase_messaging: ^16.5.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  firebase_app_check: ^0.4.6
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  permission_handler: ^12.0.1
  in_app_purchase: ^3.3.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  rive: ^0.14.11
  livekit_client: ^2.11.0
  record: ^6.2.1
  audioplayers: ^6.7.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/login_background.jpg
    - assets/images/portraits/
    - assets/rive/common/
    - assets/rive/authentication/
    - assets/rive/onboarding/
    - assets/rive/matching/
    - assets/rive/chat/
    - assets/rive/profile/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
