name: mevora
description: Mevora helps people discover compatible connections.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  cloud_functions: ^6.3.6
  firebase_messaging: ^16.5.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  firebase_app_check: ^0.4.6
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  in_app_purchase: ^3.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
