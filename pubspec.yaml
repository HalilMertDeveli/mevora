name: mevora
description: Mevora helps people discover compatible connections.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  cloud_functions: ^6.3.6
  firebase_messaging: ^16.5.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
